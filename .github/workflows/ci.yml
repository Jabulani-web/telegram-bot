name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read


# CI is deterministic: no live RPC or Telegram calls. The poller's chain
# correctness against live data is verified separately with `npm run scan`.
jobs:
  scan-secrets:
    # Secret scanning gate (issue #109). Runs before build so a leaked token
    # fails fast, without a report that could outlive the rotated secret. The
    # scanner is offline, zero-dependency and deterministic: it needs no
    # credentials and its output is always redacted (pinned by
    # tests/secrets.test.mjs, run in the build job below).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan tracked files for secret-shaped strings
        run: npm run scan:secrets

  build:
    needs: scan-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (notification formats + secret-scanner properties)
        run: npm test

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
