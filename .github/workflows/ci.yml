name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI compiles only. There are deliberately no live network calls here: the
# poller's correctness against real chain data is verified with `npm run scan`
# against Testnet by hand, and a CI job that depended on a public RPC and a
# Telegram token would fail for reasons that have nothing to do with the commit.
jobs:
  scan-secrets:
    # Secret scanning gate (issue #109). Runs before build so a leaked token
    # fails fast, without a report that could outlive the rotated secret. The
    # scanner is offline, zero-dependency and deterministic: it needs no
    # credentials and its output is always redacted (pinned by
    # tests/secrets.test.mjs, run in the build job below).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan tracked files for secret-shaped strings
        run: npm run scan:secrets

  build:
    needs: scan-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (notification formats + secret-scanner properties)
        run: npm test

      - name: Build
        run: npm run build
